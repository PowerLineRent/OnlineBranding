name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: ci-auth-secret
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-supabase-anon-key
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      POSTGRES_PRISMA_URL: postgresql://user:pass@localhost:5432/db
      POSTGRES_URL_NON_POOLING: postgresql://user:pass@localhost:5432/db
      SIGNATURE_SECRET_KEY: ci-signature-secret
      SUPABASE_SERVICE_ROLE_KEY: ci-supabase-service-role-key
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
